<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1a1a1a;color:#ccc;font-family:Arial,sans-serif;min-height:100vh;}

nav{background:rgba(0,0,0,0.95);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.back{color:#7AB800;text-decoration:none;flex-shrink:0;display:flex;align-items:center;}
.sub-nav-links{display:flex;gap:16px;align-items:center;flex:1;justify-content:center;}
.sub-nav-links a{color:#ccc;text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap;}
.sub-nav-links a:hover{color:#7AB800;}
.cta{background:#7AB800;color:#fff;padding:8px 14px;border-radius:4px;text-decoration:none;font-size:13px;font-weight:700;white-space:nowrap;flex-shrink:0;}

.hero{background:linear-gradient(135deg,#1a1a1a 0%,#2a2a2a 100%);padding:60px 24px 48px;text-align:center;border-bottom:2px solid #7AB800;}
.hero .label{color:#7AB800;font-size:13px;font-weight:700;letter-spacing:3px;margin-bottom:16px;}
.hero h1{color:#fff;font-size:clamp(26px,6vw,44px);font-weight:900;margin-bottom:12px;}
.hero p{color:#bbb;font-size:15px;max-width:560px;margin:0 auto;}

.container{max-width:1000px;margin:0 auto;padding:48px 24px 80px;}

.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
.gallery-item{border-radius:10px;overflow:hidden;aspect-ratio:4/3;cursor:pointer;background:#242424;}
.gallery-item img{width:100%;height:100%;object-fit:cover;transition:transform 0.3s;}
.gallery-item:hover img{transform:scale(1.05);}

.empty-state{text-align:center;padding:60px 20px;color:#666;}
.empty-state .icon{font-size:48px;margin-bottom:16px;}
.empty-state p{font-size:15px;}

/* Lightbox */
#lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:9999;justify-content:center;align-items:center;}
#lightbox.open{display:flex;}
#lightbox img{max-width:90vw;max-height:90vh;border-radius:8px;}
#lightbox-close{position:absolute;top:20px;right:24px;color:#fff;font-size:32px;cursor:pointer;background:none;border:none;}

footer{background:#111;border-top:1px solid #2a2a2a;padding:24px;text-align:center;}
footer p{color:#666;font-size:12px;margin-bottom:10px;}
.f-legal-links{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 16px;font-size:12px;}
.f-legal-links a{color:#7AB800;text-decoration:none;}

/* WhatsApp */
#wa-widget{position:fixed;bottom:24px;right:20px;z-index:8000;display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
#wa-options{display:none;flex-direction:column;gap:8px;align-items:flex-end;}
.wa-link{display:flex;align-items:center;gap:10px;background:#1a1a1a;border:1px solid #25D366;border-radius:50px;padding:10px 16px;text-decoration:none;}
.wa-link span{color:#fff;font-size:13px;font-weight:700;}
.wa-btn{width:56px;height:56px;border-radius:50%;background:#25D366;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(37,211,102,0.4);}

@media(max-width:600px){
  .gallery-grid{grid-template-columns:repeat(2,1fr);}
}
</style>

  "kepek/Messenger_creation_B90AE017-DB10-4CEA-B31F-B4DF2E74D199.jpeg",
  "kepek/received_1296330125924405.jpeg",
  "kepek/received_1353191776839866.jpeg",
  "kepek/received_1484671046373227.jpeg",
  "kepek/received_1736177110681993.jpeg",
  "kepek/received_1971398416841553.jpeg",
  "kepek/received_2033879210532207.jpeg",
  "kepek/received_2172258076846555.jpeg",
  "kepek/received_718576247888084.jpeg",
];

window.onload = function() {
  const container = document.getElementById('gallery-container');
  if(images.length === 0) return; // empty state marad
  
  const grid = document.createElement('div');
  grid.className = 'gallery-grid';
  
  images.forEach(function(src) {
    const item = document.createElement('div');
    item.className = 'gallery-item';
    const img = document.createElement('img');
    img.src = src;
    img.alt = 'Coolvarko munka';
    img.loading = 'lazy';
    img.onclick = function() { openLightbox(src); };
    item.appendChild(img);
    grid.appendChild(item);
  });
  
  container.innerHTML = '';
  container.appendChild(grid);
}

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}
document.getElementById('lightbox').addEventListener('click', function(e) {
  if(e.target === this) closeLightbox();
});
</script>
